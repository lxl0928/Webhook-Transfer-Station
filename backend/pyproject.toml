[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-transfer-station"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3", "cryptography>=44,<47", "httpx>=0.28,<1", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["builtin_skills/*/SKILL.md"]
