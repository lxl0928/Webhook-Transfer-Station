map $http_x_trace_id $station_trace_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_trace_id;
    default $request_id;
}
# Do not include query strings in access logs: callback URLs carry a secret wid.
log_format station '$remote_addr "$request_method $uri" $status '
                   'trace_id=$station_trace_id cost=$request_time';
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log station;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Trace-Id $station_trace_id always;
    proxy_hide_header X-Trace-Id;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $station_trace_id;
    }
    location ~ ^/(api/|webhooks$|health/|docs|redoc|openapi.json$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $station_trace_id;
        proxy_read_timeout 70s;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
