x-backend: &backend
  build: ./backend
  image: webhook-station-backend:local
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-webhooks}:${POSTGRES_PASSWORD:?Run init_env.py}@postgres:5432/${POSTGRES_DB:-webhooks}
    JWT_SECRET: ${JWT_SECRET:?Run init_env.py}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run init_env.py}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#123.}
    LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:-api.openai.com}
    ALLOW_HTTP_LLM: ${ALLOW_HTTP_LLM:-false}
  init: true
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-webhooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init_env.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 160s

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
